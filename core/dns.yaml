# 共享 DNS 与持久化默认值；不含 rules/节点/代理组/端口/TUN/mode。
# 对多个解析结果并发拨号。
tcp-concurrent: true

# 保存节点选择和 Fake-IP 映射。
profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  # listen 由客户端或原始配置管理；共享层不绑定任何 DNS 监听端口。
  # 当前方案优先 IPv4；Clash 的 DNS IPv6 设置可能覆盖这一项。
  ipv6: false

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  cache-algorithm: arc
  prefer-h3: false
  respect-rules: true
  use-hosts: true
  use-system-hosts: false

  # 下列本地、联网检测、时间同步及登录域名返回真实地址。
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.localhost"
    - "+.home.arpa"
    - "+.internal"
    - "+.in-addr.arpa"
    - "+.ip6.arpa"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "captive.apple.com"
    - "time.*.apple.com"
    - "time.windows.com"
    - "pool.ntp.org"
    - "+.pool.ntp.org"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "localhost.work.weixin.qq.com"
    - "multimedia.nt.qq.com"
    - "multimedia.nt.qq.com.cn"

  # 引导解析：仅用来找到国内 DoH 服务器的地址，不是默认网站 DNS。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 代理节点域名必须在代理建立之前就能解析；此处明确直连。
  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query#DIRECT"
    - "https://doh.pub/dns-query#DIRECT"
  proxy-server-nameserver-policy: {}

  # DIRECT 出口也用国内 DoH，并遵循下面的域名解析政策。
  direct-nameserver:
    - "https://dns.alidns.com/dns-query#DIRECT"
    - "https://doh.pub/dns-query#DIRECT"
  direct-nameserver-follow-policy: true

  # 未被国内政策匹配的域名，使用加密 DNS；连接遵循现有分流。
  # 没有硬编码任何机场节点名；需要现有配置有可用的代理兜底规则。
  nameserver:
    - "https://1.1.1.1/dns-query#RULES"
    - "https://8.8.8.8/dns-query#RULES"

  nameserver-policy:
    # 与每周更新的大陆直连域名集合共用一份分类数据。
    "rule-set:hmxx-cn-direct":
      - "https://dns.alidns.com/dns-query#DIRECT"
      - "https://doh.pub/dns-query#DIRECT"
    "+.cn":
      - "https://dns.alidns.com/dns-query#DIRECT"
      - "https://doh.pub/dns-query#DIRECT"
    # 本地名字交给当前网络的系统解析器，不硬编码家中路由器地址。
    "localhost": system
    "+.lan": system
    "+.local": system
    "+.localhost": system
    "+.home.arpa": system
    "+.internal": system

  # 用明确的 policy 分流，不继承机场原有 fallback 解析策略。
  fallback: []
  fallback-filter:
    geoip: false
    domain: []
    geosite: []
    ipcidr: []
